[package]
name = "typing-trainer"
version = "1.0.0"
description = "Next-Generation Touch Typing Training Suite"
authors = ["Shoyib Ratul <hello@shoyibratul.com>"]
repository = "https://github.com/ShoyibRatul/TypingTrainer"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
