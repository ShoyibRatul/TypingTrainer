name: DCO Check

on:
  pull_request:
    branches: [main]

jobs:
  check-dco:
    name: Developer Certificate of Origin (DCO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by in commits
        run: |
          COMMITS_MISSING_DCO=0
          for commit in $(git log --no-merges --format="%H" origin/${{ github.base_ref }}..HEAD); do
            if ! git log -n 1 --format="%B" "$commit" | grep -qi "^Signed-off-by:"; then
              echo "Error: Commit $commit is missing 'Signed-off-by:' line."
              COMMITS_MISSING_DCO=$((COMMITS_MISSING_DCO + 1))
            fi
          done

          if [ "$COMMITS_MISSING_DCO" -gt 0 ]; then
            echo ""
            echo "Failed: $COMMITS_MISSING_DCO commit(s) missing DCO sign-off."
            echo "Please sign off your commits using 'git commit -s' or amend existing commits."
            exit 1
          fi

          echo "All pull request commits are properly signed off."
