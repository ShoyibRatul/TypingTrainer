name: "Release & Multi-Platform Auto-Build"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Build Native Binaries for Windows, macOS, and Linux
  # -------------------------------------------------------------
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Typing Trainer {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Typing Trainer Release ${{ github.ref_name }}
            
            Welcome to the latest release of **Typing Trainer**, the modern multi-platform touch typing tutor!
            
            ### Included Assets:
            - **Windows**: `.msi` installer, `.exe` setup & Windows Portable `.zip`
            - **macOS**: Universal `.dmg` (Supports both Apple Silicon M1/M2/M3/M4 & Intel Macs)
            - **Linux**: `.AppImage` (Run anywhere) & `.deb` (Debian/Ubuntu/Mint)
            - **Web**: Live at GitHub Pages

      - name: Package Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "*uninstall*" } | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force -Path portable-stage | Out-Null
            Copy-Item $exe.FullName "portable-stage/TypingTrainer.exe"
            New-Item -ItemType File -Force -Path "portable-stage/portable.flag" | Out-Null
            Compress-Archive -Path "portable-stage/*" -DestinationPath "TypingTrainer-v$version-windows-x64-portable.zip" -Force
            echo "PORTABLE_ZIP=TypingTrainer-v$version-windows-x64-portable.zip" >> $env:GITHUB_ENV
          }

      - name: Upload Windows Portable ZIP to Release
        if: matrix.platform == 'windows-latest' && env.PORTABLE_ZIP != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.PORTABLE_ZIP }}
